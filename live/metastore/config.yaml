# Account-level Unity Catalog metastore (one per AWS region per Databricks account).
# Requires a Databricks account admin.
metastore:
  name: "metastore-dbx-architect-lab"
  # AWS region; must match the region of every workspace assigned to this metastore.
  region: "us-east-2"
  # Optional metastore-level managed storage. Databricks recommends leaving it unset and giving each
  # catalog its own storage root (workspace-bootstrap does this). If you set it, also set data_access_role_arn.
  # storage_root: "s3://<bucket>/metastore"
  # data_access_role_arn: "arn:aws:iam::<aws-account-id>:role/<uc-metastore-role>"
  force_destroy: true
  # Optional: Unity Catalog owner principal name (e.g. group or user).
  owner: "DBX_Architect_Lab_Admin"
  data_access_name: "default"
