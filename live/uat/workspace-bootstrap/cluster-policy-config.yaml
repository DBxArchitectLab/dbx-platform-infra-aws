cluster_policies:
  shared_compute_customize:
    description: "Shared all-purpose compute with user isolation."
    definition:
      node_type_id:
        type: unlimited
        defaultValue: m5d.xlarge
      data_security_mode:
        type: fixed
        value: USER_ISOLATION
      cluster_type:
        type: fixed
        value: all-purpose
      aws_attributes.availability:
        type: unlimited
        defaultValue: ON_DEMAND
      aws_attributes.zone_id:
        type: unlimited
        defaultValue: auto
      autoscale.min_workers:
        type: fixed
        value: 1
      autoscale.max_workers:
        type: fixed
        value: 1
      autotermination_minutes:
        type: unlimited
        defaultValue: 120
