workspace_name: "dbw-dbx-architect-lab-uat"
# AWS region; must match the Unity Catalog metastore region (live/metastore/config.yaml).
region: "us-east-1"

# IAM role the Databricks control plane assumes to launch clusters in this AWS account.
cross_account_role_name: "dbx-architect-lab-uat-crossaccount"

# Workspace root bucket. The AWS account ID is appended to keep the name globally unique.
root_bucket:
  name_prefix: "dbx-architect-lab-uat-root"
  force_destroy: true

network:
  vpc_name: "vpc-dbx-architect-lab-uat"
  vpc_cidr: "10.1.0.0/22"
  # At least two AZs. With PrivateLink, use AZs where the Databricks endpoint services are available.
  availability_zones: [ "us-east-1a", "us-east-1b" ]
  # Cluster subnets, one per AZ (netmask /17 to /26).
  private_subnet_cidrs: [ "10.1.0.0/24", "10.1.1.0/24" ]
  # VPC endpoint subnets, one per AZ (only used when private_link.enabled).
  privatelink_subnet_cidrs: [ "10.1.2.0/27", "10.1.2.32/27" ]
  # NAT gateway subnet (only used when nat_gateway_enabled).
  public_subnet_cidr: "10.1.3.0/28"
  # Outbound internet access for clusters (PyPI, Maven, external APIs).
  nat_gateway_enabled: true

# Back-end PrivateLink: clusters reach the control plane through VPC endpoints. Requires the
# Databricks Enterprise tier. Set enabled: false on a Premium account.
private_link:
  enabled: true
  # Allow users to reach the workspace UI/API from the public internet.
  public_access_enabled: true
  # Regional endpoint service names; check them against
  # https://docs.databricks.com/aws/en/resources/ip-domain-region#privatelink-vpc-endpoint-services
  workspace_vpce_service: "com.amazonaws.vpce.us-east-1.vpce-svc-09143d1e626de2f04"
  relay_vpce_service: "com.amazonaws.vpce.us-east-1.vpce-svc-00018a8c3ff62ffdf"

identity:
  platform_admin_group_name: "DBX_Architect_Lab_Admin"

tags:
  Environment: "uat"
  Application: "Databricks"
  Compliance: "HIPAA"
  Owner: "DbxArchitectLab"
