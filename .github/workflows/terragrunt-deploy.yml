name: Terragrunt Deploy Stacks
# Shown in the Actions run list, e.g. "plan dev-dbxarchitectlab-workspace by @user".
run-name: ${{ inputs.action }} ${{ inputs.stack }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to deploy
        type: choice
        required: true
        options:
          - metastore
          - dev-dbxarchitectlab-workspace
          - dev-dbxarchitectlab-workspace-bootstrap
          - uat-dbxarchitectlab-workspace
          - uat-dbxarchitectlab-workspace-bootstrap
          - prod-dbxarchitectlab-workspace
          - prod-dbxarchitectlab-workspace-bootstrap
      action:
        description: Terragrunt action
        type: choice
        required: true
        default: plan
        options:
          - validate
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

jobs:
  terragrunt:
    runs-on: ubuntu-latest
    # prod-* and uat-* stacks use the matching GitHub environment; all others use "dev".
    environment: ${{ startsWith(inputs.stack, 'prod-') && 'prod' || startsWith(inputs.stack, 'uat-') && 'uat' || 'dev' }}
    env:
      TG_NON_INTERACTIVE: "true"
      # Region of the GitHub OIDC session; each stack sets its own provider region from config.yaml.
      AWS_REGION: us-east-2
      # Databricks service principal (OAuth M2M), used by both the account and workspace providers.
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_ACCOUNT_ID: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      DATABRICKS_METASTORE_ID: ${{ secrets.DATABRICKS_METASTORE_ID }}
      # Deployment service principal, granted on the catalog and external location by workspace-bootstrap.
      DEPLOY_SP_APPLICATION_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gh-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6

      - name: Install Terragrunt
        shell: bash
        run: |
          set -euo pipefail
          TG_VERSION="0.99.4"
          curl -sSL -o terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt
          terragrunt --version

      - name: Resolve stack path
        id: stack
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.stack }}" in
            metastore) echo "path=live/metastore" >> "$GITHUB_OUTPUT" ;;
            dev-dbxarchitectlab-workspace) echo "path=live/dev/workspace" >> "$GITHUB_OUTPUT" ;;
            dev-dbxarchitectlab-workspace-bootstrap) echo "path=live/dev/workspace-bootstrap" >> "$GITHUB_OUTPUT" ;;
            uat-dbxarchitectlab-workspace) echo "path=live/uat/workspace" >> "$GITHUB_OUTPUT" ;;
            uat-dbxarchitectlab-workspace-bootstrap) echo "path=live/uat/workspace-bootstrap" >> "$GITHUB_OUTPUT" ;;
            prod-dbxarchitectlab-workspace) echo "path=live/prod/workspace" >> "$GITHUB_OUTPUT" ;;
            prod-dbxarchitectlab-workspace-bootstrap) echo "path=live/prod/workspace-bootstrap" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported stack: ${{ inputs.stack }}"; exit 1 ;;
          esac

      - name: Deployment selection
        shell: bash
        env:
          STACK: ${{ inputs.stack }}
          ACTION: ${{ inputs.action }}
          STACK_PATH: ${{ steps.stack.outputs.path }}
          GH_ENVIRONMENT: ${{ startsWith(inputs.stack, 'prod-') && 'prod' || startsWith(inputs.stack, 'uat-') && 'uat' || 'dev' }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            apply)   NOTE="changes infrastructure, auto-approved" ;;
            destroy) NOTE="DELETES the stack's resources, auto-approved" ;;
            *)       NOTE="read-only" ;;
          esac

          echo "::group::Deployment selection"
          printf '%-18s %s\n' \
            "Stack:"            "$STACK" \
            "Action:"           "$ACTION ($NOTE)" \
            "Path:"             "$STACK_PATH" \
            "GitHub env:"       "$GH_ENVIRONMENT" \
            "AWS region:"       "$AWS_REGION" \
            "Branch:"           "$GITHUB_REF_NAME" \
            "Commit:"           "${GITHUB_SHA:0:7}" \
            "Triggered by:"     "$GITHUB_ACTOR" \
            "Terraform:"        "$(terraform version | head -1)" \
            "Terragrunt:"       "$(terragrunt --version | head -1)"
          echo "::endgroup::"

          if [ "$ACTION" = "destroy" ]; then
            echo "::warning title=Destroy::$STACK will be destroyed ($STACK_PATH)"
          fi

          {
            echo "## Deployment selection"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Stack | \`$STACK\` |"
            echo "| Action | **$ACTION** ($NOTE) |"
            echo "| Path | \`$STACK_PATH\` |"
            echo "| GitHub environment | \`$GH_ENVIRONMENT\` |"
            echo "| AWS region | \`$AWS_REGION\` |"
            echo "| Branch / commit | \`$GITHUB_REF_NAME\` @ [\`${GITHUB_SHA:0:7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) |"
            echo "| Triggered by | @$GITHUB_ACTOR |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terragrunt init
        working-directory: ${{ steps.stack.outputs.path }}
        shell: bash
        run: |
          set -o pipefail
          terragrunt init -upgrade 2>&1 | tee terragrunt-init.log

      - name: Terragrunt ${{ inputs.action }}
        working-directory: ${{ steps.stack.outputs.path }}
        shell: bash
        run: |
          set -o pipefail
          case "${{ inputs.action }}" in
            validate) ARGS=(validate -no-color) ;;
            plan)     ARGS=(plan -no-color) ;;
            apply)    ARGS=(apply -auto-approve -no-color) ;;
            destroy)  ARGS=(destroy -auto-approve -no-color) ;;
          esac
          terragrunt "${ARGS[@]}" 2>&1 | tee "terragrunt-${{ inputs.action }}.log"

      - name: Upload Terragrunt logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terragrunt-logs-${{ inputs.stack }}-${{ github.run_id }}
          path: ${{ steps.stack.outputs.path }}/terragrunt-*.log
          if-no-files-found: ignore
